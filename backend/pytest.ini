[pytest]
env =
    JWT_SECRET_KEY=test_secret_key
    DJANGO_SETTINGS_MODULE=conf.settings.test
    DB_USER=root
    DB_PASSWORD=root
    DB_PORT=3306
    DB_NAME=db
python_files = tests.py test_*.py *_tests.py
pythonpath = apps
norecursedirs =
    migrations
addopts =
    -vv
    -ra
    -x
    --ff
    --cache-clear
    --cov-reset
    --color=yes
    --cov=.
    --cov-report term-missing