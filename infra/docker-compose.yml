version: "3.8"

services:
  db:
    image: mysql:8.4.2
    container_name: mysql
    volumes:
      - mysql_volume:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=contactbook
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql
    ports:
      - "3306:3306"
volumes:
  mysql_volume: